<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barbershop Care</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
  scroll-behavior: smooth;
}

body {
  background: #0a0a0a;
  color: #fff;
}

/* NAV */
header {
  position: fixed;
  width: 100%;
  padding: 20px 60px;
  display: flex;
  justify-content: space-between;
  background: rgba(0,0,0,0.85);
  backdrop-filter: blur(12px);
  z-index: 1000;
}

header h1 {
  letter-spacing: 4px;
}

nav a {
  margin-left: 30px;
  text-decoration: none;
  color: #aaa;
  transition: 0.3s;
}

nav a:hover {
  color: #d4af37;
}

/* HERO */
.hero {
  height: 100vh;
  background: linear-gradient(#000000aa,#000000aa), url('https://images.unsplash.com/photo-1599351431402-2c7d4a1bdf4f') center/cover;
  display: flex;
  justify-content: center;
  align-items: center;
}

.hero-content {
  text-align: center;
  animation: fadeUp 1.2s ease;
}

.hero h2 {
  font-size: 4rem;
  margin-bottom: 10px;
}

.hero p {
  color: #ccc;
  margin-bottom: 25px;
}

.btn {
  padding: 16px 40px;
  background: #d4af37;
  color: black;
  border: none;
  font-weight: 600;
  cursor: pointer;
  transition: 0.3s;
}

.btn:hover {
  background: white;
}

/* SECTION */
.section {
  padding: 120px 60px;
  text-align: center;
}

.section h2 {
  margin-bottom: 60px;
}

/* REVEAL */
.reveal {
  opacity: 0;
  transform: translateY(40px);
  transition: 1s;
}

.reveal.active {
  opacity: 1;
  transform: translateY(0);
}

/* GALLERY */
.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px,1fr));
  gap: 25px;
}

.gallery img {
  width: 100%;
  height: 380px;
  object-fit: cover;
  transition: 0.4s;
}

.gallery img:hover {
  transform: scale(1.07);
}

/* SERVICES */
.services {
  display: flex;
  justify-content: center;
  gap: 40px;
  flex-wrap: wrap;
}

.service {
  background: #111;
  padding: 40px;
  width: 280px;
  border: 1px solid #222;
  transition: 0.3s;
}

.service:hover {
  border-color: #d4af37;
  transform: translateY(-10px);
}

/* BOOKING */
.booking iframe {
  width: 100%;
  height: 600px;
  border: none;
}

/* MAP */
.map iframe {
  width: 100%;
  height: 350px;
  border: none;
}

/* FOOTER */
footer {
  padding: 40px;
  text-align: center;
  background: black;
  color: #666;
}

@keyframes fadeUp {
  from {opacity:0; transform:translateY(40px);}
  to {opacity:1; transform:translateY(0);}
}
</style>
</head>

<body>

<header>
  <h1>BARBERSHOP CARE</h1>
  <nav>
    <a href="#">Home</a>
    <a href="#gallery">Work</a>
    <a href="#services">Services</a>
    <a href="#booking">Book</a>
  </nav>
</header>

<section class="hero">
  <div class="hero-content">
    <h2>Stay Sharp.</h2>
    <p>Premium grooming experience</p>
    <button class="btn" onclick="location.href='#booking'">Book Now</button>
  </div>
</section>

<section id="gallery" class="section reveal">
  <h2>Latest Cuts</h2>
  <div class="gallery">
    <img src="cut1.jpg">
    <img src="cut2.jpg">
    <img src="cut3.jpg">
  </div>
</section>

<section id="services" class="section reveal">
  <h2>Services</h2>
  <div class="services">
    <div class="service"><h3>Haircut</h3><p>£20</p></div>
    <div class="service"><h3>Skin Fade</h3><p>£25</p></div>
    <div class="service"><h3>Beard Trim</h3><p>£10</p></div>
  </div>
</section>

<section id="booking" class="section booking reveal">
  <h2>Book Appointment</h2>
  <iframe src="https://calendly.com"></iframe>
</section>

<section class="map">
  <iframe src="https://maps.google.com/maps?q=london&t=&z=13&ie=UTF8&iwloc=&output=embed"></iframe>
</section>

<footer>
  <p>© 2026 Barbershop Care</p>
</footer>

<script>
function reveal() {
  const reveals = document.querySelectorAll(".reveal");
  reveals.forEach(el => {
    const windowHeight = window.innerHeight;
    const elementTop = el.getBoundingClientRect().top;
    if (elementTop < windowHeight - 100) {
      el.classList.add("active");
    }
  });
}

window.addEventListener("scroll", reveal);
</script>

</body>
</html>
